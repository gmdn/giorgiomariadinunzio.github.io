project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    # Netlify installs Quarto by extracting the release tarball into the repo
    # (quarto-<version>/). Exclude it so Quarto never tries to render the
    # template .qmd files bundled inside its own installation.
    - "!quarto-*/**"
  # After every render: sync the hero "Featured Projects" stat with the
  # projects that actually have `featured: true` (scripts/update-stats.ts),
  # then regenerate the per-page Open Graph PNG cards plus the canonical/social
  # <head> tags (scripts/generate-og.ts), and finally stamp intrinsic image
  # dimensions and lazy-loading onto the rendered pages and align sitemap.xml
  # with the canonical URLs (scripts/optimize-output.ts). Order matters: the
  # last two both rewrite the HTML generate-og.ts produced.
  post-render:
    - scripts/optimize-output.ts
  resources:
    - CNAME
    - robots.txt
    - favicon.ico
    - favicon.svg
    - safari-pinned-tab.svg
    - favicon-96x96.png
    - apple-touch-icon.png
    - site.webmanifest
    - web-app-manifest-192x192.png
    - web-app-manifest-512x512.png
    - "uploads/**"
    - "assets/media/**"
    - "assets/fonts/**"
    - assets/nw-nav.js
    - assets/social-share.js
    # Loaded dynamically from index.qmd's hero script, so Quarto's resource
    # discovery can't see it — must be listed explicitly.
    - assets/vendor/particles.min.js
    # Fetched at runtime by assets/globe.js — same story, list explicitly.
    - assets/data/globe-dots.json

filters:
  - social-share
  - code-window
  # Turns code blocks tagged `.webr` into live, editable R cells that run in
  # the reader's browser via WebAssembly. No-ops on pages without such cells.
  - webr

website:
  title: "Giorgio Maria Di Nunzio"
  description: "Academic website of Giorgio Maria Di Nunzio, Associate Professor of Computer Engineering at the University of Padova. Research in information retrieval, text analytics, computational terminology, and digital humanities."
  site-url: "https://dei.unipd.it/~dinunzio/"
  llms-txt: true
  # Cookieless GA4: `storage: none` stops gtag from writing _ga/_ga_* cookies,
  # so no ePrivacy/GDPR consent banner is required. Returning visitors are no
  # longer identified across sessions — page/referrer stats are unaffected.
  google-analytics:
    tracking-id: "G-F6NXRP46YS"
    anonymous-ip: true
    storage: none
  favicon: favicon.svg
  image: /assets/media/authors/me.webp
  open-graph: true
  twitter-card: true

  navbar:
      logo: assets/media/logo_gmdn.svg
      logo-alt: "Giorgio Maria Di Nunzio"
      title: "Giorgio Maria Di Nunzio"
      collapse-below: lg
  
      left:
        - text: Research
          href: index.qmd#research
        - text: Publications
          href: index.qmd#publications
        - text: Projects
          href: index.qmd#projects
        - text: Teaching
          href: index.qmd#teaching
        - text: News
          href: index.qmd#news
        - text: Contact
          href: index.qmd#contact
  
      #right: []
      
  search:
    location: navbar
    type: overlay
    
format:
  html:
    grid:
      body-width: 1150px
    theme:
      dark: [cosmo, assets/theme.scss, assets/theme-dark.scss]
      light: [cosmo, assets/theme.scss, assets/theme-light.scss]
    css: assets/site.css
    lightbox: auto
    include-after-body:
      - text: |
          <script src="/assets/nw-nav.js"></script>
          <script src="/assets/social-share.js"></script>
    toc: false
    anchor-sections: false
    # No page on the site uses LaTeX math, but Quarto still ships MathJax
    # (285 KiB from jsDelivr) plus a render-blocking ES6 polyfill on listing
    # pages. `plain` drops both; re-enable mathjax if a post ever needs math.
    html-math-method: plain
    link-external-newwindow: true
    lang: en
    include-in-header:
      - text: |
          <meta name="author" content="Giorgio Maria Di Nunzio">
          <script type="application/ld+json">
          {
            "@context": "https://schema.org",
            "@graph": [
              {
                "@type": "Person",
                "@id": "https://dei.unipd.it/~dinunzio/#person",
                "name": "Giorgio Maria Di Nunzio",
                "url": "https://dei.unipd.it/~dinunzio/",
                "image": "https://dei.unipd.it/~dinunzio/assets/media/authors/me.webp",
                "jobTitle": "Associate Professor of Computer Engineering",
                "email": "mailto:giorgiomaria.dinunzio@unipd.it",
                "affiliation": [
                  { 
                    "@type": "CollegeOrUniversity", 
                    "name": "University of Padova", 
                    "url": "https://www.unipd.it/" 
                  }
                ],
                "memberOf": {
                  "@type": "Organization",
                  "name": "IIIA Research Group",
                  "url": "https://iiia.dei.unipd.it/"
                },
                "knowsAbout": [
                "Information Retrieval",
                "Technology-Assisted Review",
                "Text Analytics",
                "Computational Terminology",
                "Knowledge Representation",
                "Digital Humanities"
                ],
                "sameAs": [
                  "https://www.linkedin.com/in/giorgio-maria-di-nunzio/",
                  "https://github.com/gmdn/",
                  "https://scholar.google.com/citations?hl=en&user=Awl_HDoAAAAJ",
                  "https://orcid.org/0000-0001-9709-6392"
                ]
              },
              {
                "@type": "WebSite",
                "@id": "https://dei.unipd.it/~dinunzio/#website",
                "url": "https://dei.unipd.it/~dinunzio",
                "name": "Giorgio Maria Di Nunzio",
                "description": "Academic website of Giorgio Maria Di Nunzio, Associate Professor of Computer Engineering at the University of Padova.",
                "publisher": { "@id": "https://dei.unipd.it/~dinunzio/#person" }
              }
            ]
          }
          </script>
          <link rel="preload" href="/assets/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
          <link rel="icon" href="/favicon.ico" sizes="32x32">
          <link rel="icon" type="image/svg+xml" href="/favicon.svg">
          <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96">
          <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
          <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#0076DF">
          <link rel="manifest" href="/site.webmanifest">
          <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
          <meta name="theme-color" content="#0a0a0f" media="(prefers-color-scheme: dark)">

execute:
  freeze: true
